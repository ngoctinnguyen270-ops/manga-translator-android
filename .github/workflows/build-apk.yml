name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

            - name: Install SDK platform and build tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37" "build-tools;37.0.0" || true

      - name: Download third-party OCR models
        run: |
          set -euo pipefail
          cd assets/models
          mkdir -p detection ocr
          litert=https://huggingface.co/litert-community/PP-OCRv6-Small-LiteRT/resolve/main
          curl -fL --retry 3 -o detection/ppocrv6_small_det_640_fp32.tflite $litert/ppocrv6_small_det_640_fp32.tflite
          for w in 320 640 960; do
            curl -fL --retry 3 -o ocr/ppocrv6_small_rec_${w}_fp32.tflite $litert/ppocrv6_small_rec_${w}_fp32.tflite
          done
          curl -fL --retry 3 -o ocr/characters.json $litert/characters.json
          ls -la detection ocr

      - name: Download Korean OCR model (optional)
        continue-on-error: true
        run: |
          set -euo pipefail
          cd assets/models
          kr=https://huggingface.co/PaddlePaddle/korean_PP-OCRv5_mobile_rec_onnx/resolve/main
          curl -fL --retry 3 -o ocr/korean_PP-OCRv5_mobile_rec.onnx $kr/inference.onnx
          curl -fL --retry 3 -o /tmp/korean_inference.yml $kr/inference.yml
          python3 - <<'EOF'
          import re
          text = open("/tmp/korean_inference.yml", encoding="utf-8").read()
          block = text.split("character_dict:", 1)[1]
          chars = []
          for line in block.splitlines()[1:]:
              m = re.match(r"^\s*-\s?(.*)$", line)
              if not m:
                  break
              value = m.group(1)
              if len(value) >= 2 and value[0] == value[-1] and value[0] in "'\"":
                  value = value[1:-1]
              chars.append(value)
          open("ocr/korean_PP-OCRv5_mobile_rec_dict.txt", "w", encoding="utf-8").write("\n".join(chars) + "\n")
          print("korean dict entries:", len(chars))
          EOF

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: manga-translator-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
