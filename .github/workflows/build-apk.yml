name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK platform and build tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37" "build-tools;37.0.0" || true

      - name: Download third-party OCR models
        run: |
          set -euo pipefail
          cd assets/models
          mkdir -p detection ocr
          litert=https://huggingface.co/litert-community/PP-OCRv6-Small-LiteRT/resolve/main
          curl -fL --retry 3 -o detection/ppocrv6_small_det_640_fp32.tflite $litert/ppocrv6_small_det_640_fp32.tflite
          for w in 320 640 960; do
            curl -fL --retry 3 -o ocr/ppocrv6_small_rec_${w}_fp32.tflite $litert/ppocrv6_small_rec_${w}_fp32.tflite
          done
          curl -fL --retry 3 -o ocr/characters.json $litert/characters.json
          ls -la detection ocr

      - name: Cache Gradle downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Pre-download Gradle distribution
        # services.gradle.org sometimes answers HTTP 504; try several sources and verify the
        # official SHA-256 from gradle-wrapper.properties before using any of them.
        run: |
          set -u
          PROPS=gradle/wrapper/gradle-wrapper.properties
          URL=$(grep '^distributionUrl=' $PROPS | cut -d= -f2- | sed 's#\\:#:#g')
          NAME=$(basename "$URL")
          SHA=$(grep '^distributionSha256Sum=' $PROPS | cut -d= -f2)
          ZIP="$RUNNER_TEMP/$NAME"
          ok=0
          for attempt in 1 2 3 4 5; do
            for src in "$URL" "https://downloads.gradle.org/distributions/$NAME" "https://mirrors.cloud.tencent.com/gradle/$NAME"; do
              echo "Trying $src (round $attempt)"
              if curl -fL --connect-timeout 20 --max-time 300 -o "$ZIP" "$src" && echo "$SHA  $ZIP" | sha256sum -c -; then
                ok=1; break 2
              fi
            done
            sleep 30
          done
          [ "$ok" = 1 ] || { echo "Could not download $NAME"; exit 1; }
          sed -i "s#^distributionUrl=.*#distributionUrl=file:$ZIP#" $PROPS
          grep distributionUrl $PROPS

      - name: Build debug APK
        run: |
          chmod +x gradlew
          # Retry on transient network errors (HTTP 5xx while downloading dependencies).
          for i in 1 2 3; do
            ./gradlew :app:assembleDebug --stacktrace \
              -Dorg.gradle.internal.repository.max.retries=8 \
              -Dorg.gradle.internal.repository.initial.backoff=2000 && exit 0
            echo "Build failed (attempt $i), retrying in 60s..."; sleep 60
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: manga-translator-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
